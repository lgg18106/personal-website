# Papers not yet published. status: review (submitted to a journal) or working (working paper).
# Optional links, shown when present: pdf, slides, code (URLs).
papers:
  - id: consolidation
    topic: "Fiscal policy"
    topic_es: "Política fiscal"
    tone: magenta
    status: review
    feature: >-
      Debt-to-GDP ratio after entering a fiscal consolidation, EU-27, 1996–2024. The first
      panel uses the baseline controls; the second compares countries that start from a
      similar primary balance. Points are estimates and bands are 95% confidence intervals.
    feature_es: >-
      Ratio deuda/PIB tras entrar en consolidación fiscal, UE-27, 1996–2024. El primer
      gráfico usa los controles habituales; el segundo compara con países que parten de un
      saldo primario parecido. Los puntos son estimaciones y las bandas, intervalos de
      confianza del 95 %.
    title: "Decomposing the Debt Response to Fiscal Consolidation: Evidence from EU-27 Local Projections, 1996–2024"
    coauthors: ["Cristina Mazas Pérez-Oleaga", "José M. Domínguez-Martínez"]
    figure: "images/research/consolidation-irf.png"
    figure_es: "images/research/consolidation-irf-es.png"
    figure_narrow: "images/research/consolidation-irf-narrow.png"
    figure_narrow_es: "images/research/consolidation-irf-es-narrow.png"
    figure_alt: "Response of the debt-to-GDP ratio to entering a fiscal consolidation, horizons 0 to 5, with and without conditioning on the initial primary balance, with 95% confidence bands."
    figure_alt_es: "Respuesta del ratio deuda/PIB a la entrada en consolidación fiscal, horizontes 0 a 5, con y sin controlar por el saldo primario inicial, con intervalos de confianza del 95 %."
    short: >-
      No evidence that entering a consolidation lowers the debt ratio within five
      years: the primary-balance effort is offset by the snowball term and by
      stock-flow adjustments.
    short_es: >-
      No encontramos que entrar en consolidación reduzca el ratio de deuda en
      cinco años: la mejora del saldo primario queda compensada por el efecto bola
      de nieve y los ajustes stock-flujo.
    summary: >-
      Using local projections difference-in-differences on 125 consolidation
      entries in the EU-27, we find no evidence that entering a fiscal consolidation
      lowers the debt-to-GDP ratio within five years. Conditional on the fiscal
      position at entry, the response is centred on zero; without that conditioning
      the ratio rises in the short run, consistent with selection. An exact
      decomposition shows the improvement in the primary balance offset by the
      snowball term and by stock-flow adjustments, while output contracts, public
      investment falls and no decline in borrowing costs is detected.
    post: "blog/posts/consolidacion-fiscal-deuda.html"
    post_label: "Summary in Spanish"
    post_label_es: "Resumen divulgativo"
  - id: feedback
    topic: "Econometrics"
    topic_es: "Econometría"
    tone: cyan
    status: working
    title: "Event-study estimators when adoption responds to past outcomes"
    coauthors: []
    short: >-
      When adoption responds to past shocks, the bias of standard event-study
      estimators shifts with the persistence of the outcome by the same amount for
      all of them, so choosing an estimator amounts to choosing the dynamics.
    short_es: >-
      Cuando la adopción responde a perturbaciones pasadas, el sesgo de los
      estimadores habituales de estudios de eventos cambia con la persistencia del
      resultado en la misma cuantía para todos, de modo que elegir estimador
      equivale a elegir la dinámica.
    summary: >-
      When units adopt a policy in response to past shocks to the outcome, adopters
      are selected on bad shocks and the units still untreated on good ones. Under a
      factorised adoption hazard, the paper derives a closed form for the bias of
      every calendar-weight event-study estimator, shows that none of them is
      unbiased under two different persistences of the untreated outcome, and builds
      joint confidence sets for the dynamics and the effect. Applications to banking
      deregulation, fiscal rules and democratisation.
  - id: biomarkers
    topic: "Household finance"
    topic_es: "Finanzas de los hogares"
    tone: navy
    status: working
    title: "Does Biological Ageing Foreshadow Financial Fragility? Evidence from Dried-Blood-Spot Biomarkers and Household Wealth in Europe"
    coauthors: []
    short: >-
      Blood biomarkers measured in 2015 predict lower household wealth six years
      later among Europeans aged 50 and over, partly through persistent differences
      in economic position.
    short_es: >-
      Los biomarcadores en sangre medidos en 2015 anticipan una riqueza neta menor
      seis años después entre los europeos de 50 años o más, en parte por
      diferencias económicas persistentes.
    summary: >-
      Links blood biomarkers collected in SHARE in 2015 to household net wealth six
      years later, for about 7,400 respondents aged 50 and over in 12 European
      countries. Conditional on baseline wealth, income and health, a
      one-standard-deviation higher index of biological risk predicts net wealth
      about 7% lower; part of that gap reflects persistent economic position rather
      than later decline.

