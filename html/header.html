  <div class="wrap">

    <a class="site-name es-only" href="/es/"><img class="site-logo" src="/images/logo/logo-light.svg" alt="" width="56" height="56"><span class="site-id"><span class="site-title">Gonzalo Llamosas García</span><span class="site-role">Profesor de Hacienda Pública en la Universidad de Málaga</span></span></a>
    <nav class="site-nav en-only" aria-label="Main">
      <a href="/about.html">About</a>
      <a href="/research.html">Research</a>
      <a href="/debt.html">Data</a>
      <a href="/teaching.html">Teaching</a>
      <a href="/cv/">CV</a>
      <a class="lang-switch" href="/es/" hreflang="es" lang="es">Español</a>
    </nav>
    <nav class="site-nav es-only" aria-label="Principal">
      <a href="/es/sobre-mi.html">Sobre mí</a>
      <a href="/es/#investigacion">Investigación</a>
      <a href="/es/deuda.html">Datos</a>
      <a href="/es/docencia.html">Docencia</a>

      <a class="lang-switch" href="/" hreflang="en" lang="en">English</a>
    </nav>
  </div>
</header>
<script>
(function () {
  // Quarto places include-before-body inside <main>; lift the header to the top of <body>
  var header = document.querySelector(".site-header");
  if (header) document.body.insertBefore(header, document.body.firstChild);
  // counterpart page in the other language, and the current section in the nav
  var path = location.pathname.replace(/index\.html$/, "");
  var es = /^es/.test(document.documentElement.lang);
  var pairs = [["/", "/es/"], ["/about.html", "/es/sobre-mi.html"], ["/teaching.html", "/es/docencia.html"], ["/blog/", "/es/divulgacion.html"], ["/cv/", "/es/cv.html"], ["/debt.html", "/es/deuda.html"]];
  var target = es ? "/" : "/es/";
  pairs.forEach(function (p) {
    if (!es && path === p[0]) target = p[1];
    if (es && path === p[1]) target = p[0];
  });
  if (path.indexOf("/blog/posts/") === 0) target = es ? "/blog/" : "/es/divulgacion.html";
  if (path === "/es/irpf.html") target = "/debt.html";
  document.querySelectorAll(".lang-switch").forEach(function (a) { a.setAttribute("href", target); });
  // «Datos» has two tabs, the public-debt panel and the IRPF simulator; the menu points to the first
  var tabs = [["/es/deuda.html", "Deuda pública"], ["/es/irpf.html", "Simulador del IRPF"]];
  var tabbed = tabs.some(function (t) { return t[0] === path; });
  var section = tabbed ? tabs[0][0] : path;
  document.querySelectorAll(".site-nav a:not(.lang-switch)").forEach(function (a) {
    if (a.hash) return;
    var h = a.pathname.replace(/index\.html$/, "");   // Quarto rewrites hrefs as relative paths
    if (h === section || (h.slice(-1) === "/" && h !== "/" && path.indexOf(h) === 0)) {
      a.setAttribute("aria-current", "page");
    }
  });
  // the tabs go at the foot of the title band, which is already in the page when this runs
  var title = document.querySelector("#title-block-header .quarto-title");
  if (tabbed && title) {
    var nav = document.createElement("nav");
    nav.className = "data-tabs";
    nav.setAttribute("aria-label", "Datos");
    tabs.forEach(function (t) {
      var a = document.createElement("a");
      a.href = t[0];
      a.textContent = t[1];
      if (t[0] === path) a.setAttribute("aria-current", "page");
      nav.appendChild(a);
    });
    title.appendChild(nav);
    title.closest(".quarto-title-banner").classList.add("with-tabs");
  }
})();
</script>
