<script>
(function () {
  // Quarto places include-before-body inside <main>; lift the header to the top of <body>
  var header = document.querySelector(".site-header");
  if (header) document.body.insertBefore(header, document.body.firstChild);
  // counterpart page in the other language, and the current section in the nav
  var path = location.pathname.replace(/index\.html$/, "");
  var es = /^es/.test(document.documentElement.lang);
  var pairs = [["/", "/es/"], ["/about.html", "/es/sobre-mi.html"], ["/teaching.html", "/es/docencia.html"], ["/blog/", "/es/divulgacion.html"], ["/cv/", "/es/cv.html"]];
  var target = es ? "/" : "/es/";
  pairs.forEach(function (p) {
    if (!es && path === p[0]) target = p[1];
    if (es && path === p[1]) target = p[0];
  });
  if (path.indexOf("/blog/posts/") === 0) target = es ? "/blog/" : "/es/divulgacion.html";
  document.querySelectorAll(".lang-switch").forEach(function (a) { a.setAttribute("href", target); });
  document.querySelectorAll(".site-nav a:not(.lang-switch)").forEach(function (a) {
    if (a.hash) return;
    var h = a.pathname.replace(/index\.html$/, "");   // Quarto rewrites hrefs as relative paths
    if (h === path || (h.slice(-1) === "/" && h !== "/" && path.indexOf(h) === 0)) {
      a.setAttribute("aria-current", "page");
    }
  });
})();
</script>
